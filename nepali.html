    <div class="back-home">

        { nepali: "ड्ड", eng: "Alt+0176", isShift: true, isAlt: true },
        { nepali: "ड्ढ", eng: "Alt+0149", isShift: true, isAlt: true },

        { nepali: "प्र", eng: "Alt+0204", isShift: true, isAlt: true },
        { nepali: "फ्र", eng: "Alt+0207", isShift: true, isAlt: true },
        { nepali: "य्र", eng: "Alt+0216", isShift: true, isAlt: true },
        { nepali: "रू", eng: "?", isShift: true },
        { nepali: "हृ", eng: "xl", isShift: true },
        { nepali: "ह्र", eng: "2", isShift: true },
        { nepali: "ह्व", eng: "Alt+0223", isShift: true, isAlt: true },
        { nepali: "ॐ", eng: "Alt+0231", isShift: true, isAlt: true },
        { nepali: "इ", eng: "Alt+0205", isShift: true, isAlt: true },
        { nepali: "झ", eng: "Alt+0203", isShift: true, isAlt: true },
        { nepali: "छ", eng: "Alt+0139", isShift: true, isAlt: true },
        { nepali: "छ", eng: "Alt+0163", isShift: true, isAlt: true }
    ];

    const grid = document.getElementById('keyboardGrid');
    const toggleBtn = document.getElementById('toggleShift');
    let showShift = false;

    function renderGrid() {
        grid.innerHTML = '';
        
        // Filter keys based on the shift status toggle
        const filteredData = keyData.filter(item => item.isShift === showShift);

        filteredData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'key-card';

            const charSpan = document.createElement('span');
            charSpan.className = 'nepali-char';
            charSpan.textContent = item.nepali;

            const keySpan = document.createElement('span');
            // Check if it's a standard text key or a special Alt code formatting
            keySpan.className = item.isAlt ? 'english-key alt-code' : 'english-key';
            
            // Append a small visual hint if shift is active and it's a normal letter key
            if (showShift && !item.isAlt) {
                keySpan.innerHTML = `<span class="shift-badge">Shift</span>${item.eng}`;
            } else {
                keySpan.textContent = item.eng;
            }

            card.appendChild(charSpan);
            card.appendChild(keySpan);
            grid.appendChild(card);
        });
    }

    // Toggle button click event logic
    toggleBtn.addEventListener('click', () => {
        showShift = !showShift;
        toggleBtn.classList.toggle('active', showShift);
        toggleBtn.textContent = showShift ? "Show Base Characters" : "Show Shift Key Characters";
        renderGrid();
    });

    // Initial load
    renderGrid();
</script>

</body>
</html>
