<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - TECHNOS COMPUTER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="contact-section">
    <div class="contact-box">
        <h1>Contact Us</h1>
        <p>We would love to hear from you. Send your message anytime.</p>
        <form id="contactForm">
        <div class="input-box">
                <input type="text" name="name" placeholder="Your Full Name" required></div>

            <div class="input-box">
                <input type="email" name="email" placeholder="Your Email Address" required>
            </div>

            <div class="input-box">
                <textarea name="message" rows="6" placeholder="Write Your Message Here..." required></textarea>
            </div>

            <button type="submit" class="btn"> Send </button>
        </form>
        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

        <div class="contact-info">
            <p>✉ technoscomputerbth@gmail.com</p>
        </div>
</section>
   <div class="back-home">

        <a href="home.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i> ⬅ Back To Home </a>
        </div>
    </div>

<script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("contactForm");
            const messageBox = document.getElementById("formMessage");

            if (!form || !messageBox) return;

            form.addEventListener("submit", (e) => {
                e.preventDefault();

                const name = form.querySelector('input[name="name"]').value.trim();
                const email = form.querySelector('input[name="email"]').value.trim();
                const message = form.querySelector('textarea[name="message"]').value.trim();

                if (!name || !email || !message) {
                    messageBox.textContent = "Please fill in all fields before sending.";
                    messageBox.className = "form-message error";
                    return;
                }
                messageBox.textContent = `Thank you, ${name}! Your message has been received.`;
                messageBox.className = "form-message success";
                form.reset();
            });
        });
</script>

</body>
</html>
